site_name: Spark Data Platform
site_description: Enterprise Spark Data Platform with Medallion Architecture
site_author: Data Team
site_url: https://spark-data-platform.example.com
repo_url: https://github.com/fvictoire59va/spark-data-platform
repo_name: spark-data-platform
docs_dir: docs
site_dir: site
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: light
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - scheme: dark
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - header.autohide

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Guides:
    - README: guides/README.md
    - Documentation Integration: guides/integration.md
    - Quick Start: guides/quickstart.md
    - Before & After: guides/before-after.md
    - Checklist: guides/checklist.md
    - Summary: guides/summary.md
  - Silver & Gold:
    - Overview: README_SILVER_GOLD.md
    - Pipeline Guide: SILVER_GOLD_GUIDE.md
    - Implementation: SILVER_GOLD_IMPLEMENTATION.md
  - Deployment:
    - Overview: IMPLEMENTATION_SUMMARY.md
    - Airflow Orchestration: AIRFLOW_DEPLOYMENT_SUMMARY.md
    - Airflow Setup: AIRFLOW_SETUP.md
  - Testing: INGEST_ORDERS_TEST_REPORT.md
  - API Reference: api-reference.md

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      title: Table of contents
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  version: 1.0.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fvictoire59va/spark-data-platform
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com

extra_css:
  - assets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2024-2026 Data Team. All rights reserved.
