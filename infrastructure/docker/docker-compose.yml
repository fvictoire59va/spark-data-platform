services:
  # ============ SPARK MASTER ============
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark-base
      args:
        - SPARK_VERSION=${SPARK_VERSION:-3.5.0}
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"   # Web UI
      - "7077:7077"   # Master port
      - "4040:4040"   # Application UI
    volumes:
      - ./logs/spark-master:/opt/spark/logs
      - ./data:/opt/spark/data
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      bash -c "
        ${SPARK_HOME}/sbin/start-master.sh &&
        tail -f ${SPARK_HOME}/logs/spark--org.apache.spark.deploy.master.Master-*.out
      "

  # ============ SPARK WORKERS ============
  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark-base
      args:
        - SPARK_VERSION=${SPARK_VERSION:-3.5.0}
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    volumes:
      - ./logs/spark-worker-1:/opt/spark/logs
      - ./data:/opt/spark/data
    networks:
      - spark-network
    depends_on:
      spark-master:
        condition: service_healthy
    command: >
      bash -c "
        ${SPARK_HOME}/sbin/start-worker.sh spark://spark-master:7077 &&
        tail -f ${SPARK_HOME}/logs/spark--org.apache.spark.deploy.worker.Worker-*.out
      "

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark-base
      args:
        - SPARK_VERSION=${SPARK_VERSION:-3.5.0}
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_WEBUI_PORT=8082
    ports:
      - "8082:8082"
    volumes:
      - ./logs/spark-worker-2:/opt/spark/logs
      - ./data:/opt/spark/data
    networks:
      - spark-network
    depends_on:
      spark-master:
        condition: service_healthy
    command: >
      bash -c "
        ${SPARK_HOME}/sbin/start-worker.sh spark://spark-master:7077 &&
        tail -f ${SPARK_HOME}/logs/spark--org.apache.spark.deploy.worker.Worker-*.out
      "

  # ============ SPARK HISTORY SERVER ============
  spark-history:
    build:
      context: .
      dockerfile: Dockerfile.spark-base
      args:
        - SPARK_VERSION=${SPARK_VERSION:-3.5.0}
    container_name: spark-history
    hostname: spark-history
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=/opt/spark/history
    ports:
      - "18080:18080"
    volumes:
      - ./logs/spark-history:/opt/spark/history
    networks:
      - spark-network
    command: >
      bash -c "
        mkdir -p /opt/spark/history &&
        ${SPARK_HOME}/sbin/start-history-server.sh &&
        tail -f ${SPARK_HOME}/logs/spark--org.apache.spark.deploy.history.HistoryServer-*.out
      "

  # ============ MINIO (S3 Compatible) ============
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - ./minio-data:/data
    networks:
      - spark-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ DELTA LAKE METASTORE (PostgreSQL) ============
  metastore-db:
    image: postgres:15-alpine
    container_name: metastore-db
    hostname: metastore-db
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive123
      - POSTGRES_DB=metastore
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ JUPYTER NOTEBOOK ============
  jupyter:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.spark-job
    container_name: jupyter
    hostname: jupyter
    environment:
      - SPARK_HOME=/opt/spark
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-spark123}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/spark/notebooks
      - ./data:/opt/spark/data
    networks:
      - spark-network
    depends_on:
      - spark-master
    command: >
      bash -c "
        pip install jupyterlab &&
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='${JUPYTER_TOKEN:-spark123}'
      "

  # ============ PROMETHEUS (Metrics Collection) ============
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    hostname: prometheus
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - spark-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============ GRAFANA (Visualization) ============
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    hostname: grafana
    user: root
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-spark123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - spark-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============ ALERTMANAGER (Alert Routing) ============
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    hostname: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - spark-network
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============ NODE EXPORTER (Host Metrics) ============
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    hostname: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - spark-network
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  # ============ CADVISOR (Container Metrics) ============
  # Note: cAdvisor a des problèmes de compatibilité sous Windows/Docker Desktop
  # Alternative: Utiliser le monitoring des conteneurs via node-exporter et docker-compose stats
  # Décommentez la section ci-dessous pour activer si vous êtes sous Linux

  # cadvisor:
  #   image: gcr.io/cadvisor/cadvisor:latest
  #   container_name: cadvisor
  #   hostname: cadvisor
  #   ports:
  #     - "8085:8080"
  #   volumes:
  #     - /:/rootfs:ro
  #     - /var/run:/var/run:ro
  #     - /sys:/sys:ro
  #     - /var/lib/docker/:/var/lib/docker:ro
  #     - /dev/disk/:/dev/disk:ro
  #   networks:
  #     - spark-network
  #   privileged: true
  #   devices:
  #     - /dev/kmsg
  #   restart: unless-stopped

  # ============ POSTGRES EXPORTER (Database Metrics) ============
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: postgres-exporter
    hostname: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://hive:hive123@metastore-db:5432/metastore?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - spark-network
    depends_on:
      metastore-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  spark-network:
    driver: bridge

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
