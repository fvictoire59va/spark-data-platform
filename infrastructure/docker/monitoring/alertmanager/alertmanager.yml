# Alertmanager Configuration
# ==========================

global:
  # The smarthost and SMTP sender used for mail notifications.
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@spark-platform.local'
  # smtp_auth_username: 'alertmanager'
  # smtp_auth_password: 'password'

  # Slack webhook URL (uncomment and configure if using Slack)
  # slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

  resolve_timeout: 5m

# The directory from which notification templates are read.
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# The root route on which each incoming alert enters.
route:
  # The default receiver
  receiver: 'default-receiver'

  # The labels by which incoming alerts are grouped together.
  group_by: ['alertname', 'severity', 'component']

  # When a new group of alerts is created by an incoming alert, wait at
  # least 'group_wait' to send the initial notification.
  group_wait: 30s

  # When the first notification was sent, wait 'group_interval' to send a batch
  # of new alerts that started firing for that group.
  group_interval: 5m

  # If an alert has successfully been sent, wait 'repeat_interval' to resend them.
  repeat_interval: 4h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    # Warning alerts - grouped notifications
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 4h

    # Spark specific alerts
    - match:
        component: spark
      receiver: 'spark-receiver'
      group_by: ['alertname', 'job']

    # Infrastructure alerts
    - match:
        component: infrastructure
      receiver: 'infrastructure-receiver'

# Inhibition rules
inhibit_rules:
  # If critical alert is firing, inhibit warning alerts for the same component
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['component', 'alertname']

  # If master is down, inhibit worker alerts
  - source_match:
      alertname: 'SparkMasterDown'
    target_match:
      alertname: 'SparkWorkerDown'
    equal: ['environment']

# Receivers
receivers:
  # Default receiver - logs to Alertmanager
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true
        # This webhook can be used for custom integrations

  # Critical receiver
  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/critical'
        send_resolved: true
    # Uncomment for email notifications:
    # email_configs:
    #   - to: 'oncall@example.com'
    #     send_resolved: true
    #     headers:
    #       Subject: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'

  # Warning receiver
  - name: 'warning-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/warnings'
        send_resolved: true

  # Spark specific receiver
  - name: 'spark-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/spark'
        send_resolved: true
    # Uncomment for Slack notifications:
    # slack_configs:
    #   - channel: '#spark-alerts'
    #     send_resolved: true
    #     title: '{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # Infrastructure receiver
  - name: 'infrastructure-receiver'
    webhook_configs:
      - url: 'http://localhost:5001/infrastructure'
        send_resolved: true
