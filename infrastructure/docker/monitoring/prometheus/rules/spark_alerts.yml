# Spark Alerting Rules
# ====================

groups:
  - name: spark_cluster_alerts
    interval: 30s
    rules:
      # ============ SPARK MASTER ALERTS ============
      - alert: SparkMasterDown
        expr: up{job="spark-master"} == 0
        for: 1m
        labels:
          severity: critical
          component: spark
        annotations:
          summary: "Spark Master is down"
          description: "Spark Master has been unreachable for more than 1 minute."

      - alert: SparkMasterHighMemoryUsage
        expr: (spark_master_memory_used_bytes / spark_master_memory_total_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: spark
        annotations:
          summary: "Spark Master high memory usage"
          description: "Spark Master memory usage is above 85% for more than 5 minutes."

      # ============ SPARK WORKER ALERTS ============
      - alert: SparkWorkerDown
        expr: up{job="spark-workers"} == 0
        for: 1m
        labels:
          severity: critical
          component: spark
        annotations:
          summary: "Spark Worker is down"
          description: "Spark Worker {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: SparkWorkerHighCPUUsage
        expr: rate(spark_worker_cpu_time_seconds[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
          component: spark
        annotations:
          summary: "Spark Worker high CPU usage"
          description: "Spark Worker {{ $labels.instance }} CPU usage is above 90% for more than 10 minutes."

      - alert: SparkWorkerHighMemoryUsage
        expr: (spark_worker_memory_used_bytes / spark_worker_memory_total_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: spark
        annotations:
          summary: "Spark Worker high memory usage"
          description: "Spark Worker {{ $labels.instance }} memory usage is above 85% for more than 5 minutes."

      - alert: NoActiveSparkWorkers
        expr: spark_master_workers_count == 0
        for: 2m
        labels:
          severity: critical
          component: spark
        annotations:
          summary: "No active Spark workers"
          description: "There are no active Spark workers registered with the master."

      # ============ SPARK JOB ALERTS ============
      - alert: SparkJobFailed
        expr: increase(spark_job_failed_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          component: spark
        annotations:
          summary: "Spark job failed"
          description: "A Spark job has failed in the last 5 minutes."

      - alert: SparkJobLongRunning
        expr: spark_job_duration_seconds > 3600
        for: 5m
        labels:
          severity: warning
          component: spark
        annotations:
          summary: "Long running Spark job"
          description: "Spark job {{ $labels.job_id }} has been running for more than 1 hour."

      - alert: SparkTaskFailureRateHigh
        expr: rate(spark_task_failed_total[10m]) / rate(spark_task_completed_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: spark
        annotations:
          summary: "High Spark task failure rate"
          description: "More than 10% of Spark tasks are failing."

  - name: infrastructure_alerts
    interval: 30s
    rules:
      # ============ CONTAINER ALERTS ============
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"spark.*|minio|metastore.*"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.name }} CPU usage is above 80% for more than 5 minutes."

      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name=~"spark.*|minio|metastore.*"} / container_spec_memory_limit_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.name }} memory usage is above 85% for more than 5 minutes."

      - alert: ContainerRestarted
        expr: increase(container_restart_count{name=~"spark.*|minio|metastore.*"}[1h]) > 3
        for: 0m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Container frequent restarts"
          description: "Container {{ $labels.name }} has restarted more than 3 times in the last hour."

      # ============ MINIO ALERTS ============
      - alert: MinioDown
        expr: up{job="minio"} == 0
        for: 1m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "MinIO is down"
          description: "MinIO storage service has been unreachable for more than 1 minute."

      - alert: MinioDiskUsageHigh
        expr: minio_cluster_disk_total_free_bytes / minio_cluster_disk_total_bytes * 100 < 15
        for: 10m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "MinIO disk space low"
          description: "MinIO disk space is below 15% free."

      # ============ POSTGRESQL ALERTS ============
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL metastore database has been unreachable for more than 1 minute."

      - alert: PostgresHighConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL high connection count"
          description: "PostgreSQL connection usage is above 80% of max_connections."

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_database_blks_hit{datname="metastore"}[5m]) / (rate(pg_stat_database_blks_hit{datname="metastore"}[5m]) + rate(pg_stat_database_blks_read{datname="metastore"}[5m])) < 0.9
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL cache hit ratio low"
          description: "PostgreSQL cache hit ratio is below 90%, indicating potential performance issues."

  - name: system_alerts
    interval: 30s
    rules:
      # ============ NODE ALERTS ============
      - alert: HostHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Host high CPU usage"
          description: "Host {{ $labels.instance }} CPU usage is above 80% for more than 10 minutes."

      - alert: HostHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Host high memory usage"
          description: "Host {{ $labels.instance }} memory usage is above 85% for more than 5 minutes."

      - alert: HostDiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 < 15
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Host disk space low"
          description: "Host {{ $labels.instance }} disk {{ $labels.mountpoint }} has less than 15% free space."

      - alert: HostDiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) * 100 < 5
        for: 5m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "Host disk space critical"
          description: "Host {{ $labels.instance }} disk {{ $labels.mountpoint }} has less than 5% free space."
