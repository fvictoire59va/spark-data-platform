# Configuration Spark pour l'environnement DEV

# Master
SPARK_MASTER="local[*]"

# Resources
SPARK_DRIVER_MEMORY="2g"
SPARK_EXECUTOR_MEMORY="4g"
SPARK_EXECUTOR_CORES="2"

# Delta Lake
SPARK_DELTA_VERSION="3.0.0"

# Paths
SPARK_WAREHOUSE_DIR="/tmp/spark-warehouse"
SPARK_CHECKPOINT_DIR="/tmp/spark-checkpoints"

# Storage
S3_BUCKET="spark-data-platform-dev"
BRONZE_PATH="s3a://${S3_BUCKET}/bronze"
SILVER_PATH="s3a://${S3_BUCKET}/silver"
GOLD_PATH="s3a://${S3_BUCKET}/gold"

# Logging
SPARK_LOG_LEVEL="INFO"
